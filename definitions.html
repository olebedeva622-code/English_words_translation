<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Определения">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<title>Определения — зачёт</title>
<style>
  :root{
    --bg:#f5f5f7; --card:#ffffff; --text:#111318; --muted:#767a83; --line:#e3e4e8;
    --accent:#2f6df6; --ok:#12996a; --ok-bg:#e6f6ef; --err:#d63c31; --err-bg:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1013; --card:#171a1f; --text:#f2f3f5; --muted:#8b909a; --line:#272b32;
      --accent:#5b8dff; --ok:#3ecf8e; --ok-bg:#12301f; --err:#ff6b5e; --err-bg:#331b1a;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; font-size:16px;
  }
  #app{
    max-width:600px; margin:0 auto; min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column;
    padding: max(14px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  .screen{display:none; flex:1; flex-direction:column; gap:14px;}
  .screen.active{display:flex;}
  .spacer{flex:1;}

  /* ---------- Home ---------- */
  .home-head{padding:14px 2px 0;}
  .home-head h1{font-size:32px; margin:0 0 6px; letter-spacing:-.02em; font-weight:700;}
  .muted{color:var(--muted); font-size:14px; margin:0;}
  .settings{display:flex; flex-direction:column; gap:16px; margin-top:6px;}
  .field-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:8px;}
  .seg{display:flex; background:var(--card); border:1px solid var(--line); border-radius:13px; padding:3px; gap:3px;}
  .seg button{
    flex:1; padding:11px 4px; border:0; background:transparent; color:var(--muted);
    font-size:14px; font-weight:600; border-radius:10px; font-family:inherit; cursor:pointer;
    transition:background .15s, color .15s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .seg button.on{background:var(--accent); color:#fff;}

  /* ---------- Buttons ---------- */
  .primary{
    width:100%; padding:16px; border-radius:15px; border:0;
    background:var(--accent); color:#fff; font-size:16px; font-weight:600;
    font-family:inherit; cursor:pointer; transition:opacity 0.15s;
  }
  .primary:active{opacity:.85;}
  .primary.big{padding:18px; font-size:17px;}
  .secondary{
    width:100%; padding:15px; border-radius:15px; border:1px solid var(--line);
    background:var(--card); color:var(--text); font-size:16px; font-weight:600;
    font-family:inherit; cursor:pointer;
  }
  .secondary:active{opacity:.75;}
  .ghost{
    width:100%; padding:14px; border:0; background:transparent; color:var(--muted);
    font-size:15px; font-weight:500; font-family:inherit; cursor:pointer;
  }
  .ghost:active{opacity:.6;}
  .hidden{display:none !important;}

  /* ---------- Quiz ---------- */
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .icon-btn{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--line);
    background:var(--card); color:var(--muted); font-size:16px; line-height:1;
    display:grid; place-items:center; cursor:pointer; font-family:inherit; padding:0;
  }
  .counter{font-size:15px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums;}
  .counter b{color:var(--text);}
  .score{font-size:15px; font-weight:700; color:var(--ok); font-variant-numeric:tabular-nums;}
  .progress{height:4px; background:var(--line); border-radius:2px; overflow:hidden;}
  .progress > div{height:100%; width:0; background:var(--accent); border-radius:2px; transition:width .25s ease;}

  /* Flashcard specific */
  .flashcard{
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:24px 20px; display:flex; flex-direction:column; gap:16px;
    align-items:center; justify-content:center; text-align:center;
    min-height:220px; transition:all 0.2s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,0.02);
  }
  .flashcard.flipped { align-items: flex-start; text-align: left; justify-content: flex-start; }
  .f-term{font-size:clamp(20px, 6vw, 28px); line-height:1.3; font-weight:700; letter-spacing:-.01em; overflow-wrap:break-word; word-break:break-word;}
  .f-def{font-size:clamp(16px, 4.2vw, 19px); line-height:1.5; color:var(--text); display:none;}
  .flashcard.flipped .f-def{display:block;}
  
  .self-assess{display:flex; gap:10px; width:100%; margin-top:auto;}
  .btn-err{background:var(--err-bg); color:var(--err); border:1px solid var(--err);}
  .btn-ok{background:var(--ok-bg); color:var(--ok); border:1px solid var(--ok);}
  .self-assess button{padding:16px; border-radius:15px; font-size:16px; font-weight:700; cursor:pointer; flex:1; font-family:inherit; transition:transform 0.1s;}
  .self-assess button:active{transform:scale(0.97);}

  /* Choice specific */
  .option{
    width:100%; text-align:left; padding:16px; border-radius:15px;
    border:1px solid var(--line); background:var(--card); color:var(--text);
    font-size:15px; line-height:1.45; font-weight:500; font-family:inherit;
    cursor:pointer; transition:background .15s, border-color .15s;
    overflow-wrap:break-word;
  }
  .option:active{opacity:.75;}
  .option.ok{background:var(--ok-bg); border-color:var(--ok); color:var(--ok); font-weight:600;}
  .option.err{background:var(--err-bg); border-color:var(--err); color:var(--err);}
  .option:disabled{opacity:1; cursor:default;}
  
  .banner{padding:13px 15px; border-radius:13px; font-size:15px; font-weight:600; line-height:1.4; overflow-wrap:break-word;}
  .banner.ok{background:var(--ok-bg); color:var(--ok);}
  .banner.err{background:var(--err-bg); color:var(--err);}

  .footer{margin-top:auto; padding-top:6px;}

  /* ---------- Result ---------- */
  .result{display:flex; flex-direction:column; align-items:center; gap:4px; padding:26px 0 10px;}
  .result-score{font-size:54px; font-weight:700; letter-spacing:-.03em; font-variant-numeric:tabular-nums;}
  .result-sub{font-size:15px; color:var(--muted); font-weight:600;}
  .result-actions{display:flex; flex-direction:column; gap:10px;}
  .section-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-top:8px;}

  /* ---------- List ---------- */
  .list{display:flex; flex-direction:column;}
  .row{padding:12px 2px; border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:0;}
  .row-term{font-size:16px; font-weight:700; line-height:1.3; margin-bottom:4px;}
  .row-def{font-size:14px; color:var(--muted); line-height:1.4;}
</style>
</head>
<body>
<div id="app">

  <!-- ============ HOME ============ -->
  <section class="screen active" id="screen-home">
    <div class="home-head">
      <h1>Определения</h1>
      <p class="muted">Заучивание терминов · 122 шт.</p>
    </div>

    <div class="settings">
      <div class="field">
        <div class="field-label">Режим</div>
        <div class="seg" data-key="mode">
          <button type="button" data-val="flash" class="on">Карточки</button>
          <button type="button" data-val="choice">Выбор варианта</button>
        </div>
      </div>
      <div class="field">
        <div class="field-label">Часть</div>
        <div class="seg" data-key="range">
          <button type="button" data-val="all" class="on">Все</button>
          <button type="button" data-val="a">1–40</button>
          <button type="button" data-val="b">41–80</button>
          <button type="button" data-val="c">81–122</button>
        </div>
      </div>
    </div>

    <div class="spacer"></div>
    <button class="primary big" id="btnStart">Начать</button>
    <button class="ghost" id="btnList">Список всех терминов</button>
  </section>

  <!-- ============ QUIZ ============ -->
  <section class="screen" id="screen-quiz">
    <div class="topbar">
      <button class="icon-btn" id="btnQuit" aria-label="Выйти">✕</button>
      <div class="counter"><b id="qNum">1</b> / <span id="qTotal">1</span></div>
      <div class="score"><span id="qScore">0</span> ✓</div>
    </div>
    <div class="progress"><div id="progFill"></div></div>

    <!-- Flashcard Container -->
    <div class="flashcard" id="flashContainer">
      <div class="f-term" id="fTerm">Term</div>
      <div class="f-def" id="fDef">Definition</div>
    </div>

    <!-- Answer Area for Choice Mode -->
    <div id="answerArea" class="answer-area"></div>

    <!-- Footer Actions -->
    <div class="footer">
      <!-- For Flashcard Mode -->
      <button class="primary big" id="btnShowDef">Показать определение</button>
      <div class="self-assess hidden" id="selfAssess">
        <button type="button" class="btn-err" id="btnKnewNot">Не помню</button>
        <button type="button" class="btn-ok" id="btnKnew">Помню</button>
      </div>
      
      <!-- For Choice Mode -->
      <button class="primary hidden" id="btnNext">Далее</button>
    </div>
  </section>

  <!-- ============ RESULT ============ -->
  <section class="screen" id="screen-result">
    <div class="topbar">
      <div class="counter"><b>Результат</b></div>
      <div></div>
    </div>
    <div class="result">
      <div class="result-score" id="resScore">0 / 0</div>
      <div class="result-sub" id="resPct">0%</div>
    </div>
    <div class="result-actions">
      <button class="primary" id="btnRetryWrong">Повторить ошибки</button>
      <button class="secondary" id="btnAgain">Пройти заново</button>
      <button class="ghost" id="btnHome">На главную</button>
    </div>
    <div class="section-label hidden" id="wrongLabel">Ошибки</div>
    <div id="wrongList" class="list"></div>
  </section>

  <!-- ============ LIST ============ -->
  <section class="screen" id="screen-list">
    <div class="topbar">
      <button class="icon-btn" id="btnBackList" aria-label="Назад">←</button>
      <div class="counter"><b>Все термины</b></div>
      <div style="width:38px"></div>
    </div>
    <input class="secondary" id="searchInput" type="search" placeholder="Поиск по термину или определению…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="width:100%; padding:15px; font-size:15px; border-radius:15px; margin-bottom:10px;">
    <div id="allList" class="list"></div>
  </section>

</div>

<script>
/* ================= ДАННЫЕ: term / definition ================= */
const DATA = [
  { term: "Desktop PC", def: "A personal computer designed for use in a single, stationary location, typically consisting of a system unit, monitor, keyboard, and mouse." },
  { term: "Laptop PC", def: "A portable computer that you can carry with you. It has a built-in screen, keyboard, touchpad, and a battery." },

  { term: "Supercomputer", def: "The fastest type of computer, containing tens of thousands of processors for simultaneous execution of data-intensive tasks such as weather forecasting and aerodynamics." },
  { term: "Tablet PC", def: "A highly portable mobile device with a touch screen interface, typically lacking a physical keyboard and using a mobile operating system." },

  { term: "ALU (Arithmetic Logic Unit)", def: "The specific part of the CPU that performs actual arithmetic (e.g., addition, subtraction) and logical operations (e.g., AND, OR, NOT)." },

  { term: "Control Unit", def: "The component of the CPU that interprets instructions from the user's program and directs the rest of the hardware to execute them." },
  { term: "Expansion slot", def: "A socket on the motherboard that allows users to install expansion cards to add features like sound or network capabilities." },
  { term: "Hardware", def: "Any physical, electronic, or mechanical part of a computer system that can be seen or touched." },
  { term: "Input device", def: "A hardware unit that enables the user to enter data into the computer's memory, such as a keyboard, mouse, or scanner." },
  { term: "IR (Instruction Register)", def: "A CPU register that holds the instruction that is being executed now." },
  { term: "Motherboard", def: "The main circuit board of a computer that holds the CPU, memory chips, expansion slots, and controllers for peripherals." },
  { term: "Mouse", def: "A small input device used to specify the position of the cursor or to make choices from menus." },
  { term: "Output device", def: "Any peripheral that allows the user to extract or view the finished results from the system, such as a monitor or printer." },
  { term: "Peripherals", def: "Physical units attached to the computer, including input, output, and storage devices." },
  { term: "PC (Program Counter)", def: "A CPU register that keeps track of the next instruction to be performed." },

  { term: "Scanner", def: "An input device that converts images, printed text or handwriting into a digital image." },
  { term: "Speaker", def: "A device that provides sound output." },
  { term: "Storage device", def: "A peripheral device used for permanent or long-term storage of data and programs, such as hard drives or flash drives." },
  
  { term: "CLI (Command line interface)", def: "The way to interact with a computer system through typing various commands in the form of lines of text." },
  { term: "Compatible", def: "Being able to work with another device or program." },
  { term: "Cooperative multitasking", def: "A computer multitasking technique in which the operating system never initiates a context switch from a running process to another process." },

  { term: "Proprietary software", def: "Non-free software whose users are not allowed to share, modify it, and distribute the modifications." },
  { term: "Spreadsheet", def: "A computer application for organization, analysis and storage of data in a tabular form." },
  { term: "Word processor", def: "A computer application used to compose and edit texts." },

  { term: "Ad hoc topology", def: "A wireless peer-to-peer network that does not rely on the existing infrastructure." },
  { term: "Bluetooth", def: "A wireless technology that allows mobile devices and other peripheral devices to communicate over short distances." },

  { term: "Cybersecurity", def: "The practice of protecting computers, networks, and data from attacks." },
  { term: "Differential backup", def: "A backup method that copies only the files changed since the last full backup." },
  { term: "Encryption", def: "The process of encoding data so that only authorized people can read it." },
  { term: "Firewall", def: "Software or hardware that protects a network by filtering incoming traffic." },
  { term: "Heuristic scanning", def: "A malware detection method that looks for suspicious behavior instead of known virus signatures." },
  { term: "MFA (Multi-factor authentication)", def: "A security method that requires more than one way to prove your identity (like a password and a code)." },
  { term: "Password", def: "A secret string of characters used to prove your identity." },
  { term: "Signature (virus)", def: "A unique pattern or feature used to identify a specific computer virus." },
  { term: "Symmetric encryption", def: "An encryption method that uses the same key to both encrypt and decrypt data." }
];

/* ================= СОСТОЯНИЕ ================= */
const state = {
  mode: 'flash',
  range: 'all',
  queue: [],
  pos: 0,
  score: 0,
  wrong: [],
  answered: false,
  flipped: false,
  token: 0
};

const $ = function(s){ return document.querySelector(s); };

function show(id){
  document.querySelectorAll('.screen').forEach(function(s){
    s.classList.toggle('active', s.id === id);
  });
  window.scrollTo(0, 0);
}

function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ================= НАСТРОЙКИ ================= */
document.querySelectorAll('.seg').forEach(function(seg){
  seg.addEventListener('click', function(e){
    const b = e.target.closest('button');
    if(!b) return;
    seg.querySelectorAll('button').forEach(function(x){
      x.classList.toggle('on', x === b);
    });
    state[seg.dataset.key] = b.dataset.val;
  });
});

/* ================= СБОРКА ВОПРОСОВ ================= */
const RANGES = { all:[0, DATA.length], a:[0,40], b:[40,80], c:[80, DATA.length] };

function buildPool(){
  const r = RANGES[state.range] || RANGES.all;
  const idx = [];
  for(let i = r[0]; i < r[1]; i++) idx.push(i);
  return shuffle(idx);
}

function startQuiz(indices){
  const pool = indices ? indices.slice() : buildPool();
  state.queue = shuffle(pool);
  state.pos = 0;
  state.score = 0;
  state.wrong = [];
  state.answered = false;
  state.flipped = false;
  state.token++;
  show('screen-quiz');
  nextQuestion();
}

function makeOptions(correctIdx){
  const set = new Set([correctIdx]);
  let guard = 0;
  while(set.size < 4 && guard++ < 800){
    const j = Math.floor(Math.random() * DATA.length);
    if(j !== correctIdx) set.add(j);
  }
  return shuffle(Array.from(set));
}

/* ================= РЕНДЕР ВОПРОСА ================= */
function nextQuestion(){
  if(state.pos >= state.queue.length){ finish(); return; }

  const token = ++state.token;
  state.answered = false;
  state.flipped = false;

  const idx = state.queue[state.pos];
  const t = DATA[idx];

  $('#qNum').textContent = state.pos + 1;
  $('#qTotal').textContent = state.queue.length;
  $('#qScore').textContent = state.score;
  $('#progFill').style.width = (state.pos / state.queue.length * 100) + '%';
  
  const flashContainer = $('#flashContainer');
  flashContainer.classList.remove('flipped');
  
  const btnShowDef = $('#btnShowDef');
  const selfAssess = $('#selfAssess');
  const btnNext = $('#btnNext');
  const answerArea = $('#answerArea');

  // Reset visibility
  btnShowDef.classList.add('hidden');
  selfAssess.classList.add('hidden');
  btnNext.classList.add('hidden');
  answerArea.innerHTML = '';

  if(state.mode === 'flash'){
    flashContainer.style.display = 'flex';
    $('#fTerm').textContent = t.term;
    $('#fDef').textContent = t.def;
    btnShowDef.classList.remove('hidden');
    
    // Attach event handlers for flashcard
    btnShowDef.onclick = function() {
      flashContainer.classList.add('flipped');
      btnShowDef.classList.add('hidden');
      selfAssess.classList.remove('hidden');
    };
  } else {
    // Choice mode
    flashContainer.style.display = 'flex'; // Keep it to show the term
    $('#fTerm').textContent = t.term;
    $('#fDef').textContent = ''; // Hide definition
    flashContainer.classList.add('flipped'); // Ensure normal styles
    
    // Render options
    const options = makeOptions(idx);
    options.forEach(optIdx => {
      const optDef = DATA[optIdx].def;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'option';
      b.textContent = optDef;
      b.addEventListener('click', function(){ pickOption(b, optIdx === idx, t, token); });
      answerArea.appendChild(b);
    });
  }
}

/* ================= ОТВЕТЫ ================= */
function registerAnswer(ok){
  if(ok){ state.score++; }
  else { state.wrong.push(state.queue[state.pos]); }
  $('#qScore').textContent = state.score;
}

// Flashcard self-assessment
$('#btnKnew').addEventListener('click', function(){
  if(state.answered) return;
  state.answered = true;
  registerAnswer(true);
  advance();
});

$('#btnKnewNot').addEventListener('click', function(){
  if(state.answered) return;
  state.answered = true;
  registerAnswer(false);
  advance();
});

// Choice selection
function pickOption(btn, isCorrect, termObj, token){
  if(state.answered || token !== state.token) return;
  state.answered = true;

  Array.prototype.forEach.call($('#answerArea').children, function(b){
    b.disabled = true;
    if(b.textContent === termObj.def) b.classList.add('ok');
    else if(b === btn) b.classList.add('err');
  });

  registerAnswer(isCorrect);

  if(isCorrect){
    setTimeout(function(){ if(token === state.token) advance(); }, 700);
  } else {
    $('#btnNext').classList.remove('hidden');
  }
}

function advance(){
  state.pos++;
  if(state.pos >= state.queue.length){ finish(); return; }
  nextQuestion();
}

/* ================= ЗАВЕРШЕНИЕ ================= */
function finish(){
  const total = state.queue.length;
  const correct = state.score;
  const pct = total ? Math.round(correct / total * 100) : 0;

  $('#resScore').textContent = correct + ' / ' + total;
  $('#resPct').textContent = pct + '%';

  const wl = $('#wrongList');
  wl.innerHTML = '';

  const retryBtn = $('#btnRetryWrong');
  const wrongLabel = $('#wrongLabel');

  if(state.wrong.length){
    retryBtn.classList.remove('hidden');
    retryBtn.textContent = 'Повторить ошибки (' + state.wrong.length + ')';
    wrongLabel.classList.remove('hidden');

    const frag = document.createDocumentFragment();
    state.wrong.forEach(function(i){
      const t = DATA[i];
      const row = document.createElement('div');
      row.className = 'row';
      const a = document.createElement('div');
      a.className = 'row-term';
      a.textContent = t.term;
      const b = document.createElement('div');
      b.className = 'row-def';
      b.textContent = t.def;
      row.appendChild(a);
      row.appendChild(b);
      frag.appendChild(row);
    });
    wl.appendChild(frag);
  } else {
    retryBtn.classList.add('hidden');
    wrongLabel.classList.add('hidden');
  }

  show('screen-result');
}

/* ================= КНОПКИ УПРАВЛЕНИЯ ================= */
$('#btnStart').addEventListener('click', function(){ startQuiz(null); });

$('#btnNext').addEventListener('click', function(){
  if(state.answered) advance();
});

$('#btnQuit').addEventListener('click', function(){
  if(confirm('Прервать тренировку?')){
    state.token++;
    show('screen-home');
  }
});

$('#btnAgain').addEventListener('click', function(){ startQuiz(null); });

$('#btnRetryWrong').addEventListener('click', function(){
  if(state.wrong.length) startQuiz(state.wrong);
});

$('#btnHome').addEventListener('click', function(){ show('screen-home'); });

$('#btnList').addEventListener('click', function(){
  $('#searchInput').value = '';
  renderList('');
  show('screen-list');
});

$('#btnBackList').addEventListener('click', function(){ show('screen-home'); });

/* ================= СПИСОК ================= */
function renderList(filter){
  const q = (filter || '').trim().toLowerCase();
  const list = $('#allList');
  const frag = document.createDocumentFragment();

  DATA.forEach(function(t){
    if(q && t.term.toLowerCase().indexOf(q) === -1 && t.def.toLowerCase().indexOf(q) === -1) return;
    const row = document.createElement('div');
    row.className = 'row';
    const a = document.createElement('div');
    a.className = 'row-term';
    a.textContent = t.term;
    const b = document.createElement('div');
    b.className = 'row-def';
    b.textContent = t.def;
    row.appendChild(a);
    row.appendChild(b);
    frag.appendChild(row);
  });

  list.innerHTML = '';
  list.appendChild(frag);
}

$('#searchInput').addEventListener('input', function(e){
  renderList(e.target.value);
});
</script>
</body>
</html>
